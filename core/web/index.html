  const mode = def.type === 'selector';
  const c = { def, el: btn, busy: false, pending: null };
  btn.addEventListener('click', () => openBar(c));
  c.update = () => {
    const v = readValue(def.id);
    arm.style.visibility = typeof v === 'number' ? '' : 'hidden';
    if (typeof v === 'number') {
      let deg = v / KNOB_MAX * 270 - 135;
      if (mode) deg = def.side === 'T' ? tedModeDeg(v) : MODE_BASE + (1 - v) * MODE_STEP;
      arm.style.transform = 'rotate(' + deg + 'deg)';
    }
    btn.setAttribute('aria-disabled', String(!can(c)));
  };
  return c;
}

function buildStick(def) {
  const pad = make('div', 'panel pad');
  const ring = make('div', 'padring');
  const dot = make('div', 'paddot');
  pad.append(make('div', 'padlabel', def.label), ring, dot);
  const c = { def, el: pad };
  const stream = makeStream(CURSOR_GAP_MS, (value) => send({ id: def.id, value }));
  let drag = null;
  const at = (e) => {
    const r = pad.getBoundingClientRect();
    return [e.clientX - r.left - pad.clientLeft, e.clientY - r.top - pad.clientTop];
  };
  const finish = (e) => {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    drag = null;
    pad.classList.remove('live');
    stream.flush({ x: 0, y: 0 }, true);
  };
  pad.addEventListener('pointerdown', (e) => {
    if (drag || !can(c)) return;
    pad.setPointerCapture(e.pointerId);
    const [x, y] = at(e);
    const radius = CURSOR_RADIUS * Math.min(pad.clientWidth, pad.clientHeight);
    drag = { id: e.pointerId, x, y, radius };
    ring.style.left = x + 'px';
    ring.style.top = y + 'px';
    ring.style.width = ring.style.height = radius * 2 + 'px';
    dot.style.left = x + 'px';
    dot.style.top = y + 'px';
    pad.classList.add('live');
  });
  pad.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    if (!can(c)) {
      finish(null);
      return;
    }
    const [x, y] = at(e);
    let dx = (x - drag.x) / drag.radius;
    let dy = (y - drag.y) / drag.radius;
    const len = Math.hypot(dx, dy);
    if (len > 1) {
      dx /= len;
      dy /= len;
    }
    dot.style.left = drag.x + dx * drag.radius + 'px';
    dot.style.top = drag.y + dy * drag.radius + 'px';
    stream.push({ x: Math.round(dx * 1000) / 1000, y: Math.round(-dy * CURSOR_Y_SIGN * 1000) / 1000 });
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((type) => pad.addEventListener(type, finish));
  c.update = () => pad.setAttribute('aria-disabled', String(!can(c)));
  return c;
}

function barTitle(def) {
  if (views[activeIndex].layout === 'panel') return def.label;
  const side = def.side ? DISPLAYS.find(([s]) => s === def.side)[1] : 'KU';
  return side + ' · ' + def.label;
}

function placePopup(anchor, width, height, prefer) {
  const area = document.getElementById('controls').getBoundingClientRect();
  const gear = document.getElementById('gear').getBoundingClientRect();
  const safe = { left: POPUP_GAP, top: area.top + POPUP_GAP, right: window.innerWidth - POPUP_GAP, bottom: window.innerHeight - POPUP_GAP };
  const hole = { left: gear.left - POPUP_GAP, top: gear.top - POPUP_GAP, right: gear.right + POPUP_GAP, bottom: gear.bottom + POPUP_GAP };
  let left = anchor.left + (anchor.width - width) / 2;
  let top = anchor.top + (anchor.height - height) / 2;
  if (prefer === 'below') {
    if (anchor.bottom + POPUP_GAP + height <= safe.bottom) top = anchor.bottom + POPUP_GAP;
    else if (anchor.top - POPUP_GAP - height >= safe.top) top = anchor.top - POPUP_GAP - height;
  }
  left = Math.max(safe.left, Math.min(left, safe.right - width));
  top = Math.max(safe.top, Math.min(top, safe.bottom - height));
  if (left < hole.right && left + width > hole.left && top < hole.bottom && top + height > hole.top) {
    const dx = left + width - hole.left;
    const dy = top + height - hole.top;
    if (dx <= dy) left -= dx;
    else top -= dy;
  }
  return { left, top };
}

function openBar(c) {
  if (!can(c)) return;
  closePopups();
  const mode = c.def.type === 'selector';
  bar = { c, mode, hold: null, holdAt: 0, dragging: false, stops: [] };
  const post = (value) => send({ id: c.def.id, value });
  bar.stream = makeStream(KNOB_GAP_MS, post);
  document.getElementById('ktitle').textContent = barTitle(c.def);
  const stops = document.getElementById('kstops');
  stops.replaceChildren();
  if (mode) {
    c.def.positions.forEach((p) => {
      const btn = make('button', 'pos', p.label);
      btn.type = 'button';
      btn.addEventListener('click', () => {
        if (!bar || !can(c) || c.busy || p.disabled || readValue(c.def.id) === p.value) return;
        run(c, { id: c.def.id, value: p.value }, p.value).then(renderBar);
        renderBar();
      });
      stops.append(btn);
      bar.stops.push(btn);
    });
  }
  document.getElementById('ktrack').style.display = mode ? 'none' : '';
  stops.style.display = mode ? '' : 'none';
  document.getElementById('kpct').textContent = '';
  const panel = document.getElementById('kbar');
  const pos = placePopup((c.el.querySelector('.dial') || c.el).getBoundingClientRect(), Math.min(420, window.innerWidth - 24), 120, 'below');
  panel.style.left = pos.left + 'px';
  panel.style.top = pos.top + 'px';
  document.body.classList.add('knob-open');
  renderBar();
}

function closeBar() {
  bar = null;
  document.body.classList.remove('knob-open');
}

function closeChooser() {
  chooser = null;
  document.body.classList.remove('pick-open');
}

function closePopups() {
  closeBar();
  closeChooser();
}

function arcCentres(angles, w, h, radius) {
  const mid = (Math.min(...angles) + Math.max(...angles)) / 2;
  let points = [];
  for (let spread = 1; spread <= PICK_SPREAD_MAX; spread += PICK_SPREAD_STEP) {
    points = angles.map((a) => {
      const rad = (mid + (a - mid) * spread) * Math.PI / 180;
      return [radius * Math.sin(rad), -radius * Math.cos(rad)];
    });
    const clear = points.every(([x, y], i) => points.slice(i + 1).every(([u, v]) => Math.abs(x - u) >= w + PICK_GAP || Math.abs(y - v) >= h + PICK_GAP));
    if (clear) break;
  }
  return points;
}

function layoutChooser(def, stops, body) {
  const w = Math.max(PICK_SIZE, ...stops.map((btn) => btn.offsetWidth));
  const h = PICK_SIZE;
  let centres = def.positions.map((p, i) => (def.orient === 'h' ? [i * (w + PICK_GAP), 0] : [0, i * (h + PICK_GAP)]));
  if (def.style === 'rotary') centres = arcCentres(def.positions.map((p) => p.angle), w, h, PICK_RADIUS + PICK_RADIUS_STEP * (Math.min(stops.length, 4) - 2));
  const left = Math.min(...centres.map(([x]) => x)) - w / 2;
  const top = Math.min(...centres.map(([, y]) => y)) - h / 2;
  body.style.width = Math.max(...centres.map(([x]) => x)) + w / 2 - left + 'px';
  body.style.height = Math.max(...centres.map(([, y]) => y)) + h / 2 - top + 'px';
  stops.forEach((btn, i) => {
    btn.style.width = w + 'px';
    btn.style.height = h + 'px';
    btn.style.left = centres[i][0] - w / 2 - left + 'px';
    btn.style.top = centres[i][1] - h / 2 - top + 'px';
  });
}

function freePosition(c, p) {
  return can(c) && !c.busy && !p.disabled && readValue(c.def.id) !== p.value;
}

function selectPosition(c, p) {
  if (!freePosition(c, p)) return;
  run(c, { id: c.def.id, value: p.value }, p.value);
}

function openChooser(c, anchor) {
  if (!can(c)) return;
  closePopups();
  const body = document.getElementById('cbody');
  document.getElementById('ctitle').textContent = c.def.label;
  body.replaceChildren();
  const stops = c.def.positions.map((p) => {
    const btn = make('button', p.disabled ? 'pos dis' : 'pos', p.label);
    btn.type = 'button';
    if (p.momentary) btn.insertAdjacentHTML('beforeend', ICONS.spring);
    btn.addEventListener('click', () => {
      if (p.disabled) return;
      selectPosition(c, p);
      closeChooser();
    });
    body.append(btn);
    return btn;
  });
  chooser = { c, stops };
  document.body.classList.add('pick-open');
  layoutChooser(c.def, stops, body);
  const card = document.getElementById('chooser');
  const pos = placePopup(anchor.getBoundingClientRect(), card.offsetWidth, card.offsetHeight, 'center');
  card.style.left = pos.left + 'px';
  card.style.top = pos.top + 'px';
  renderChooser();
}

function renderChooser() {
  if (!chooser) return;
  const { c, stops } = chooser;
  const v = readValue(c.def.id);
  document.getElementById('chooser').setAttribute('aria-disabled', String(!can(c)));
  c.def.positions.forEach((p, i) => {
    stops[i].classList.toggle('cur', v === p.value);
    stops[i].classList.toggle('pending', c.pending === p.value);
    stops[i].setAttribute('aria-disabled', String(!!p.disabled || !can(c) || c.busy));
  });
}

function barFraction(e) {
  const r = document.getElementById('ktrack').getBoundingClientRect();
  const half = document.getElementById('khandle').offsetWidth / 2;
  return Math.min(Math.max((e.clientX - r.left - half) / (r.width - half * 2), 0), 1);
}

function barMove(e) {
  const value = Math.round(barFraction(e) * KNOB_MAX);
  bar.hold = value;
  bar.holdAt = Date.now();
  bar.stream.push(value);
  renderBar();
}

function renderBar() {
  if (!bar) return;
  const c = bar.c;
  const id = c.def.id;
  document.getElementById('kbar').setAttribute('aria-disabled', String(!can(c)));
  if (bar.mode) {
    const v = readValue(id);
    c.def.positions.forEach((p, i) => {
      bar.stops[i].classList.toggle('cur', v === p.value);
      bar.stops[i].classList.toggle('pending', c.pending === p.value);
      bar.stops[i].setAttribute('aria-disabled', String(!!p.disabled || !can(c) || c.busy));
    });
    return;
  }
  const v = readValue(id);
  if (bar.hold !== null && !bar.dragging && ((typeof v === 'number' && Math.abs(v - bar.hold) <= KNOB_TOL) || Date.now() - bar.holdAt > CONFIRM_MS)) bar.hold = null;
  const shown = bar.hold !== null ? bar.hold : v;
  const known = typeof shown === 'number';
  const handle = document.getElementById('khandle');
  handle.classList.toggle('none', !known);
  handle.classList.toggle('pending', bar.hold !== null && !bar.dragging);
  document.getElementById('kpct').textContent = known ? Math.round(shown / KNOB_MAX * 100) + ' %' : '';
  if (known) handle.style.left = 'calc((100% - 40px) * ' + shown / KNOB_MAX + ')';
}

function initBar() {
  const track = document.getElementById('ktrack');
  const endDrag = () => {
    if (!bar || !bar.dragging) return;
    bar.dragging = false;
    bar.holdAt = Date.now();
    bar.stream.flush(bar.hold, false);
    renderBar();
  };
  track.addEventListener('pointerdown', (e) => {
    if (!bar || bar.mode || bar.dragging || !can(bar.c)) return;
    track.setPointerCapture(e.pointerId);
    bar.dragging = true;
    barMove(e);
  });
  track.addEventListener('pointermove', (e) => {
    if (bar && bar.dragging) barMove(e);
  });
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);
  const kclose = document.getElementById('kclose');
  kclose.innerHTML = ICONS.close;
  kclose.addEventListener('click', closeBar);
  document.getElementById('kscrim').addEventListener('click', closePopups);
}

function buildRocker(def, cls) {
  const plate = cls !== undefined;
  const vertical = !def.lr;
  const dirs = vertical ? ['up', 'down'] : ['left', 'right'];
  const el = make('div', (plate ? cls : 'mkey fix') + ' rocker ' + (vertical ? 'v' : 'h'));
  const c = { def, el, busy: false, pending: null, vertical, halves: [], dirs };
  dirs.forEach((dir, i) => {
    const half = make('button', 'rhalf ' + 'ab'[i]);
    setLabel(half, def.positions[dir], def.label + ' ' + dir);
    half.type = 'button';
    half.addEventListener('click', () => {
      if (!can(c) || c.busy) return;
      run(c, { id: def.id, value: dir }, dir);
    });
    el.append(half);
    c.halves.push(half);
  });
  if (!plate) el.insertBefore(make('span', 'rlabel', def.label), c.halves[1]);
  c.update = () => {
    c.halves.forEach((half, i) => {
      half.classList.toggle('pressed', c.busy && c.pending === dirs[i]);
      half.setAttribute('aria-disabled', String(!can(c) || c.busy));
    });
  };
  return c;
}

function buildMpdButton(def) {
  if (!def.side) return buildButton(def, 'push cbtn', def.label);
  if (def.side === 'T') {
    if (/^B[1-4]$/.test(def.slot)) return buildButton(def, 'mkey var e-b', '');
    return buildButton(def, def.slot === 'AST' ? 'mkey fix ast' : 'mkey fix', def.label);
  }
  const edge = def.slot !== 'B1' && /^[TLRB][1-6]$/.test(def.slot) ? def.slot[0].toLowerCase() : null;
  if (edge) return buildButton(def, 'mkey var e-' + edge, '');
  return buildButton(def, def.slot === 'AST' ? 'mkey fix ast' : 'mkey fix', def.label);
}

function buildKuButton(def) {
  const cls = 'kkey' + (KU_ROUND.includes(def.slot) ? ' rnd' : '') + (KU_SMALL.includes(def.slot) ? ' sm' : '');
  const c = buildButton(def, cls, def.label);
  if (KU_BOXED.includes(def.slot)) {
    c.el.textContent = '';
    c.el.append(make('span', 'boxed', def.label));
  }
  return c;
}

function buildScratch(def) {
  const box = make('div', 'kudisp');
  const c = { def, el: box };
  c.update = () => {
    const v = readValue(def.id);
    box.textContent = v === null || v === undefined ? '' : String(v).trim();
  };
  return c;
}

function closeGuard() {
  if (!lifted) return;
  const { c, timer } = lifted;
  clearTimeout(timer);
  lifted = null;
  c.cover.classList.remove('open');
}

function openGuard(c) {
  closeGuard();
  lifted = { c, timer: setTimeout(closeGuard, GUARD_MS) };
  c.cover.classList.add('open');
}

function addGuard(c, items) {
  const cover = make('button', 'gcover');
  cover.type = 'button';
  cover.setAttribute('aria-label', 'Lift cover');
  cover.innerHTML = PADLOCK;
  const [x, y, w, h] = c.def.at;
  const [gx, gy, gw, gh] = c.def.cover_at;
  boxRect(cover, { x, y, w, h }, gx + gw / 2, gy + gh / 2, gw, gh);
  cover.style.right = cover.style.bottom = 'auto';
  cover.style.setProperty('--gf', 'calc(var(--du) * ' + c.def.kit.cover_frame + ')');
  cover.style.setProperty('--gl', 'calc(var(--du) * ' + c.def.kit.cover_lock + ')');
  cover.addEventListener('click', async () => {
    if (c.busy) return;
    closeGuard();
    if (await run(c, { id: c.def.id, guard: 'open' }, null)) openGuard(c);
  });
  c.cover = cover;
  c.el.append(cover);
  items.forEach(({ el, ready, fire }) => {
    el.addEventListener('click', () => {
      if (!lifted || lifted.c !== c || !can(c) || c.busy || !ready()) return;
      closeGuard();
      fire();
    });
  });
}

function buildPlateButton(def) {
  const round = def.shape === 'round';
  const c = buildButton(def, 'pbtn' + (round ? ' round' : '') + (def.style ? ' ' + def.style : '') + (def.color ? ' c-' + def.color : ''), '');
  const btn = c.el;
  c.el = make('div', 'pctl');
  c.el.append(btn);
  if (def.legend) btn.append(make('span', 'plegend', def.legend));
  btn.classList.add('k-body');
  if (def.kit.face) {
    btn.style.setProperty('--fi', (1 - def.kit.face / def.at[2]) * 50 + '%');
    btn.style.setProperty('--lf', 'calc(var(--du) * ' + def.kit.legend_size + ')');
  }
  const halves = (def.lamps || []).map((l, i) => {
    const half = make('span', 'plamp ' + (i ? 'low' : 'up') + ' c-' + l.color, l.legend);
    btn.append(half);
    return half;
  });
  const update = c.update;
  c.update = () => {
    update();
    btn.classList.toggle('lit', !!def.lamp && readValue(def.lamp) === 1);
    halves.forEach((half, i) => half.classList.toggle('lit', readValue(def.lamps[i].id) === 1));
  };
  c.touchAt = ([x, y, w, h]) => [{ el: btn, cx: x + w / 2, cy: y + h / 2, w, h }];
  if (def.guard) {
    addGuard(c, [{ el: btn, ready: () => true, fire: () => run(c, { id: def.id }, null) }]);
    if (round) c.cover.classList.add('round');
  }
  return c;
}

function toggleArt(cx, cy, r) {
  return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#101112" stroke="#e8e8e8" stroke-width="3"/>'
    + '<circle cx="' + cx + '" cy="' + cy + '" r="' + r * 0.74 + '" fill="#3b1d19" stroke="#8a3a2b" stroke-width="3"/>'
    + '<circle cx="' + cx + '" cy="' + cy + '" r="' + r * 0.42 + '" fill="#050505"/>'
    + '<line class="lv" x1="' + cx + '" y1="' + cy + '" x2="' + cx + '" y2="' + cy + '" stroke="#cfd3d8" stroke-width="8" stroke-linecap="round"/>'
    + '<circle class="tip" cx="' + cx + '" cy="' + cy + '" r="7" fill="#e9edf0" stroke="#7b8288" stroke-width="2"/>';
}

function knobDefs() {
  const stops = (colors) => colors.map((c, i) => '<stop offset="' + i / (colors.length - 1) + '" stop-color="' + c + '"/>').join('');
  const tones = Object.keys(KNOB_TONES).map((name) => {
    const t = KNOB_TONES[name];
    return '<radialGradient id="kn-' + name + '-rim" cx="0.42" cy="0.38" r="0.72">' + stops(t.rim) + '</radialGradient>'
      + '<linearGradient id="kn-' + name + '-ridge" x1="0" y1="0" x2="1" y2="1">' + stops(t.ridge) + '</linearGradient>'
      + '<radialGradient id="kn-' + name + '-cap" cx="0.5" cy="0.5" r="0.55" fx="0.33" fy="0.27">' + stops(t.cap) + '</radialGradient>'
      + '<linearGradient id="kn-' + name + '-bevel" x1="0" y1="0" x2="1" y2="1">' + stops(t.bevel) + '</linearGradient>';
  });
  return '<svg class="kdefs" aria-hidden="true"><defs>'
    + '<radialGradient id="kn-cast"><stop offset="0.75" stop-color="#000" stop-opacity="0.7"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>'
    + tones.join('') + '</defs></svg>';
}

function knobFace(x, y, r, tone) {
  const t = KNOB_TONES[tone];
  const large = r >= KNOB_LARGE;
  const n = (v) => Math.round(v * 100) / 100;
  const disc = (f, attrs, dx = 0, dy = 0) => '<circle cx="' + n(x + dx * r) + '" cy="' + n(y + dy * r) + '" r="' + n(f * r) + '" ' + attrs + '/>';
  const rim = (f) => disc(f, 'fill="url(#kn-' + tone + '-rim)" stroke="' + t.edge + '" stroke-width="' + n(0.02 * r) + '"');
  const bar = (from, to, w, color) => '<line x1="' + x + '" y1="' + n(y - from * r) + '" x2="' + x + '" y2="' + n(y - to * r) + '" stroke="' + color + '" stroke-width="' + n(w * r) + '" stroke-linecap="round"/>';
  const ring = 0.785;
  const dash = (Math.PI * ring * r / KNOB_RIDGES).toFixed(3);
  return disc(0.94, 'class="kn-shadow" fill="url(#kn-cast)"', 0.045, 0.055)
    + (large ? rim(0.94) + rim(0.88) : rim(0.94))
    + disc(ring, 'fill="none" stroke="' + t.base + '" stroke-width="' + n(0.2 * r) + '"')
    + disc(ring, 'fill="none" stroke="url(#kn-' + tone + '-ridge)" stroke-width="' + n(0.17 * r) + '" stroke-dasharray="' + dash + ' ' + dash + '" stroke-dashoffset="' + dash / 2 + '"')
    + disc(0.66, 'fill="url(#kn-' + tone + '-cap)"')
    + disc(0.66, 'fill="none" stroke="url(#kn-' + tone + '-bevel)" stroke-width="' + n(0.04 * r) + '"')
    + disc(0.615, 'fill="none" stroke="#000" stroke-opacity="0.16" stroke-width="' + n(0.05 * r) + '"')
    + '<g class="pt">' + bar(0, 0.56, 0.16, t.base) + bar(0, 0.54, 0.07, '#e4e7e9') + bar(0.38, 0.54, 0.11, '#ffffff') + '</g>';
}

function rotaryArt(x, y, r) {
  return knobFace(x, y, r, 'dark');
}

function positionEdges(def) {
  const [x, y, w, h] = def.at;
  const [start, size, key] = def.orient === 'h' ? [x, w, 'x'] : [y, h, 'y'];
  const p = def.positions;
  if (p[0][key] === undefined) return p.map((q, i) => [start + size * i / p.length, start + size * (i + 1) / p.length]);
  const order = p.map((q, i) => i).sort((a, b) => p[a][key] - p[b][key]);
  const edges = [];
  order.forEach((i, k) => {
    edges[i] = [k > 0 ? (p[i][key] + p[order[k - 1]][key]) / 2 : start, k < p.length - 1 ? (p[i][key] + p[order[k + 1]][key]) / 2 : start + size];
  });
  return edges;
}

function placeBand(btn, def, [from, to]) {
  const [x, y, w, h] = def.at;
  if (def.orient === 'h') {
    btn.style.left = (from - x) / w * 100 + '%';
    btn.style.width = (to - from) / w * 100 + '%';
    btn.style.top = '0';
    btn.style.height = '100%';
    return;
  }
  btn.style.top = (from - y) / h * 100 + '%';
  btn.style.height = (to - from) / h * 100 + '%';
}

function buildPlateSwitch(def) {
  const [ax, ay, w, h] = def.at;
  const n = def.positions.length;
  const cx = w / 2;
  const cy = h / 2;
  const r = def.kit.ring / 2;
  const travel = def.kit.lever / 2;
  const rotary = def.style === 'rotary';
  const horiz = def.orient === 'h';
  const kx = rotary ? def.knob[0] - ax : 0;
  const ky = rotary ? def.knob[1] - ay : 0;
  const wrap = make('div', def.guard ? 'pctl' : 'pctl thru');
  wrap.insertAdjacentHTML('beforeend', '<svg class="pswitch" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">'
    + (rotary ? rotaryArt(kx, ky, def.knob[2]) : toggleArt(cx, cy, r)) + '</svg>');
  const lever = wrap.querySelector('.lv');
  const tip = wrap.querySelector('.tip');
  const pointer = wrap.querySelector('.pt');
  wrap.querySelector('circle:not(.kn-shadow)').classList.add('k-body');
  const c = { def, el: wrap, busy: false, pending: null, buttons: [] };
  if (def.guard) {
    const edges = positionEdges(def);
    const items = def.positions.map((p, i) => {
      const btn = make('button', 'ppos');
      btn.type = 'button';
      placeBand(btn, def, edges[i]);
      btn.setAttribute('aria-label', p.label);
      wrap.append(btn);
      c.buttons.push(btn);
      return { el: btn, ready: () => freePosition(c, p), fire: () => run(c, { id: def.id, value: p.value }, p.value) };
    });
    c.touchAt = ([x, y, tw, th]) => c.buttons.map((el, i) => {
      const mid = (edges[i][0] + edges[i][1]) / 2;
      const len = edges[i][1] - edges[i][0];
      return horiz ? { el, cx: mid, cy: y + th / 2, w: len, h: th } : { el, cx: x + tw / 2, cy: mid, w: tw, h: len };
    });
    addGuard(c, items);
  } else {
    const tx = rotary ? def.knob[0] : ax + cx;
    const ty = rotary ? def.knob[1] : ay + cy;
    const d = (rotary ? def.knob[2] : r) * 2;
    const tap = make('button', 'pstap');
    tap.type = 'button';
    tap.setAttribute('aria-label', def.label);
    boxRect(tap, { x: ax, y: ay, w, h }, tx, ty, d, d);
    tap.addEventListener('click', () => openChooser(c, tap));
    wrap.append(tap);
    c.buttons.push(tap);
    c.touchAt = () => [{ el: tap, cx: tx, cy: ty, w: d, h: d }];
  }
  c.update = () => {
    const idx = def.positions.findIndex((p) => p.value === readValue(def.id));
    if (rotary) {
      pointer.setAttribute('transform', 'rotate(' + (idx < 0 ? 0 : def.positions[idx].angle) + ' ' + kx + ' ' + ky + ')');
      pointer.style.visibility = idx < 0 ? 'hidden' : '';
    } else {
      const d = idx < 0 || n < 2 ? 0 : (idx / (n - 1) * 2 - 1) * travel;
      lever.setAttribute(horiz ? 'x2' : 'y2', (horiz ? cx : cy) + d);
      tip.setAttribute(horiz ? 'cx' : 'cy', (horiz ? cx : cy) + d);
      lever.style.visibility = tip.style.visibility = idx < 0 ? 'hidden' : '';
    }
    if (def.guard) {
      def.positions.forEach((p, i) => {
        c.buttons[i].classList.toggle('pending', c.pending === p.value);
        c.buttons[i].setAttribute('aria-disabled', String(!!p.disabled || !can(c) || c.busy));
      });
    } else {
      c.buttons[0].classList.toggle('pending', c.pending !== null);
      c.buttons[0].setAttribute('aria-disabled', String(!can(c)));
    }
  };
  return c;
}

function buildPlateCover(def) {
  const btn = make('button', 'pcover');
  btn.type = 'button';
  btn.setAttribute('aria-label', def.label);
  const wrap = make('div', 'pctl thru');
  wrap.append(btn);
  const c = { def, el: wrap, busy: false, pending: null };
  btn.addEventListener('click', () => {
    const open = readValue(def.id) === 1;
    if (!can(c) || c.busy) return;
    run(c, { id: def.id, value: open ? 0 : 1 }, open ? 0 : 1);
  });
  c.update = () => {
    btn.classList.toggle('open', readValue(def.id) === 1);
    btn.setAttribute('aria-disabled', String(!can(c) || c.busy));
  };
  c.touchAt = () => [];
  return c;
}

function leverY(def, raw) {
  const p = def.positions;
  let i = 1;
  while (i < p.length - 1 && raw > p[i].value) i++;
  const f = Math.min(Math.max((raw - p[i - 1].value) / (p[i].value - p[i - 1].value), 0), 1);
  return p[i - 1].y + (p[i].y - p[i - 1].y) * f;
}

function slotSvg(def) {
  const [x, y, w, h] = def.at;
  const [hx, hw, hh] = def.handle;
  return '<svg class="pswitch" viewBox="' + [x, y, w, h].join(' ') + '" aria-hidden="true">'
    + plateArt({ shape: 'slot', at: def.kit.slot, body: true })
    + '<rect class="pgrip" x="' + (hx - hw / 2) + '" y="0" width="' + hw + '" height="' + hh + '" rx="' + hh / 4 + '"/></svg>';
}

function buildPlateLever(def) {
  const [x, , w] = def.at;
  const hh = def.handle[2];
  const p = def.positions;
  const wrap = make('div', 'pctl');
  wrap.insertAdjacentHTML('beforeend', slotSvg(def));
  const grip = wrap.querySelector('.pgrip');
  const c = { def, el: wrap, busy: false, pending: null, doneAt: 0, buttons: [], bands: [] };
  const edges = positionEdges(def);
  p.forEach((q, i) => {
    const btn = make('button', 'ppos');
    btn.type = 'button';
    placeBand(btn, def, edges[i]);
    btn.setAttribute('aria-label', q.label);
    btn.addEventListener('click', () => {
      if (!q.disabled) goLever(c, i);
    });
    wrap.append(btn);
    c.buttons.push(btn);
    c.bands.push({ el: btn, cx: x + w / 2, cy: (edges[i][0] + edges[i][1]) / 2, w, h: edges[i][1] - edges[i][0] });
  });
  c.update = () => {
    const [, shown] = leverShown(c);
    const raw = readValue(def.readback);
    const known = shown !== null && typeof raw === 'number';
    const gy = c.pending !== null ? p[shown].y : known ? leverY(def, raw) : 0;
    grip.style.visibility = known ? '' : 'hidden';
    grip.setAttribute('y', gy - hh / 2);
    grip.classList.toggle('pending', c.pending !== null);
    p.forEach((q, i) => {
      c.buttons[i].classList.toggle('pending', c.pending === i);
      c.buttons[i].setAttribute('aria-disabled', String(!!q.disabled || !can(c) || c.busy));
    });
  };
  c.touchAt = () => c.bands;
  return c;
}

function buildPlateSlider(def) {
  const [x, y, w, h] = def.at;
  const hh = def.handle[2];
  const [top, bottom] = def.kit.track;
  const wrap = make('div', 'pctl');
  wrap.insertAdjacentHTML('beforeend', slotSvg(def));
  const grip = wrap.querySelector('.pgrip');
  const btn = make('button', 'pslot');
  btn.type = 'button';
  btn.setAttribute('aria-label', def.label);
  wrap.append(btn);
  const c = { def, el: wrap, busy: false, pending: null };
  btn.addEventListener('click', () => openBar(c));
  c.update = () => {
    const v = readValue(def.id);
    grip.style.visibility = typeof v === 'number' ? '' : 'hidden';
    if (typeof v === 'number') grip.setAttribute('y', bottom + (top - bottom) * v / KNOB_MAX - hh / 2);
    btn.setAttribute('aria-disabled', String(!can(c)));
  };
  c.touchAt = () => [{ el: btn, cx: x + w / 2, cy: y + h / 2, w, h }];
  return c;
}

function knobArt(r) {
  return knobFace(r, r, r, 'grey');
}

function addMark(group, c) {
  const [x, y, w, h] = c.def.mark;
  const [dx, dy, d] = c.def.dot;
  const btn = make('button', 'pmark');
  const dot = make('span', 'pdot');
  btn.type = 'button';
  btn.setAttribute('aria-label', c.def.label);
  dot.style.left = (dx - d / 2 - x) / w * 100 + '%';
  dot.style.top = (dy - d / 2 - y) / h * 100 + '%';
  dot.style.width = d / w * 100 + '%';
  dot.style.height = d / h * 100 + '%';
  btn.append(dot);
  boxRect(btn, group.at, x + w / 2, y + h / 2, w, h);
  btn.addEventListener('click', () => {
    knobChoice[group.name] = group.members.indexOf(c);
    render();
  });
  group.wrap.append(btn);
  group.marks.push({ el: btn, cx: x + w / 2, cy: y + h / 2, w, h });
  c.mark = btn;
}

function buildPlateKnob(def) {
  const [ax, ay, w, h] = def.at;
  const r = w / 2;
  const c = { def, el: null, busy: false, pending: null };
  let group = null;
  if (def.group) {
    group = knobGroups[def.group] || (knobGroups[def.group] = { name: def.group, members: [], marks: [], at: { x: ax, y: ay, w, h }, wrap: null });
    group.members.push(c);
    if (group.wrap) {
      c.el = group.wrap;
      addMark(group, c);
      c.update = () => {};
      c.touchAt = () => [];
      return c;
    }
  }
  const wrap = make('div', 'pctl');
  wrap.insertAdjacentHTML('beforeend', '<svg class="pswitch" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' + knobArt(r) + '</svg>');
  const pointer = wrap.querySelector('.pt');
  const btn = make('button', 'pslot');
  btn.type = 'button';
  btn.setAttribute('aria-label', def.label);
  wrap.append(btn);
  c.el = wrap;
  if (group) {
    group.wrap = wrap;
    addMark(group, c);
  }
  const shown = () => (group ? group.members[knobChoice[group.name] || 0] : c);
  const ring = make('span', 'gring');
  ring.innerHTML = RING_ROUND;
  ring.style.setProperty('--hold', PULL_HOLD_MS + 'ms');
  wrap.append(ring);
  let timer = null;
  let held = false;
  const stop = () => {
    clearTimeout(timer);
    timer = null;
    ring.classList.remove('fill');
  };
  btn.addEventListener('pointerdown', (e) => {
    stop();
    held = false;
    const pull = controls.find((x) => x.def.id === shown().def.pull);
    if (!pull || !can(pull) || pull.busy) return;
    try { btn.releasePointerCapture(e.pointerId); } catch (err) { /* not captured */ }
    ring.classList.add('fill');
    timer = setTimeout(() => {
      stop();
      held = true;
      const next = readValue(pull.def.id) === 1 ? 0 : 1;
      run(pull, { id: pull.def.id, value: next }, next);
    }, PULL_HOLD_MS);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((type) => btn.addEventListener(type, stop));
  btn.addEventListener('click', () => {
    if (held) {
      held = false;
      return;
    }
    openBar(shown());
  });
  c.update = () => {
    const s = shown();
    const v = readValue(s.def.id);
    pointer.style.visibility = typeof v === 'number' ? '' : 'hidden';
    if (typeof v === 'number') pointer.setAttribute('transform', 'rotate(' + (s.def.sweep[0] + (s.def.sweep[1] - s.def.sweep[0]) * v / KNOB_MAX) + ' ' + r + ' ' + r + ')');
    btn.setAttribute('aria-disabled', String(!can(s)));
    wrap.classList.toggle('pout', !!s.def.pull && readValue(s.def.pull) === 1);
    if (group) group.members.forEach((m) => m.mark.classList.toggle('sel', m === s));
  };
  c.touchAt = ([x, y]) => [{ el: btn, cx: x + w / 2, cy: y + h / 2, w, h }, ...(group ? group.marks : [])];
  return c;
}

function buildPlateCap(def) {
  const btn = make('button', 'pcap');
  btn.type = 'button';
  btn.setAttribute('aria-label', def.label);
  const wrap = make('div', 'pctl');
  wrap.append(btn);
  const c = { def, el: wrap, busy: false, pending: null };
  btn.addEventListener('click', () => {
    if (!can(c) || c.busy) return;
    const next = readValue(def.id) === 1 ? 0 : 1;
    run(c, { id: def.id, value: next }, next);
  });
  c.update = () => {
    btn.classList.toggle('lit', readValue(def.id) === 1);
    btn.classList.toggle('pending', c.pending !== null);
    btn.setAttribute('aria-disabled', String(!can(c) || c.busy));
  };
  c.touchAt = ([x, y, w, h]) => [{ el: btn, cx: x + w / 2, cy: y + h / 2, w, h }];
  return c;
}

function buildPlateChip(def) {
  const btn = make('button', 'pchipb');
  btn.type = 'button';
  btn.setAttribute('aria-label', def.label);
  if (def.legend) btn.dataset.legend = def.legend;
  const wrap = make('div', 'pctl pchip');
  wrap.append(btn);
  const c = { def, el: wrap, busy: false, pending: null };
  btn.addEventListener('click', () => {
    if (!can(c) || c.busy) return;
    const next = readValue(def.id) === 1 ? 0 : 1;
    run(c, { id: def.id, value: next }, next);
  });
  c.update = () => {
    const p = def.positions.find((q) => q.value === readValue(def.id));
    const text = p ? p.label : '–';
    if (btn.textContent !== text) btn.textContent = text;
    btn.classList.toggle('lit', readValue(def.id) === 1);
    btn.classList.toggle('pending', c.pending !== null);
    btn.setAttribute('aria-disabled', String(!can(c) || c.busy));
  };
  c.touchAt = ([x, y, w, h]) => [{ el: btn, cx: x + w / 2, cy: y + h / 2, w, h, min: CHIP_TOUCH_MIN }];
  return c;
}

function buildPlateHat(def) {
  const c = buildRocker(def, 'pctl prock');
  c.touchAt = ([x, y, w, h]) => halfTouch(c, [x + w / 2, y + h / 2, w, h]);
  return c;
}

function buildPlateDisplay(def) {
  const [, , w, h] = def.at;
  const cols = def.cols || LINE_COLS;
  const rows = def.pages ? Math.max(...Object.values(def.pages).map((page) => page.length)) : def.ids.length;
  const ratio = document.createElement('canvas').getContext('2d');
  ratio.font = 'bold 100px ' + MONO_FONT;
  const em = ratio.measureText('0').width / 100;
  const text = make('div', 'ptext');
  const el = make('div', 'pctl pdisp');
  text.style.fontFamily = MONO_FONT;
  el.style.setProperty('--em', cols * em);
  el.style.setProperty('--rows', rows);
  el.style.setProperty('--sy', h * em * cols / (rows * w));
  el.append(text);
  const c = { def, el };
  const line = (id) => {
    const v = readValue(id);
    return typeof v === 'string' ? v.replace(/\0+$/, '') : '';
  };
  c.update = () => {
    const page = def.pages ? def.pages[line(def.page).trim()] || [] : null;
    const shown = (page ? page.map((row) => row.map((id) => line(id).trim()).join(' ')) : def.ids.map(line)).join('\n');
    if (text.textContent !== shown) text.textContent = shown;
  };
  c.touchAt = () => [];
  return c;
}

function buildPlateBar(def) {
  const el = make('div', 'pctl pbar');
  const face = barFace(def);
  el.append(face.track, face.text);
  return { def, el, update: face.update, touchAt: () => [] };
}

function buildIndicator(def) {
  if (def.shape === 'lamp') {
    const lamp = make('div', 'pctl pind plit c-' + def.color, def.legend);
    return { def, el: lamp, update: () => lamp.classList.toggle('lit', readValue(def.id) > 0), touchAt: () => [] };
  }
  const [, , w, h] = def.at;
  const letter = def.shape === 'letter';
  const el = make('div', 'pctl pind');
  el.insertAdjacentHTML('beforeend', '<svg class="pswitch" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">'
    + (letter ? '<text x="' + w / 2 + '" y="' + h / 2 + '" dy="0.35em" text-anchor="middle" font-size="' + def.size + '">' + def.text + '</text>' : '<path d="' + def.d + '"/>')
    + '</svg>');
  const shape = el.querySelector(letter ? 'text' : 'path');
  const c = { def, el };
  c.update = () => {
    const level = readValue(def.bright) > 0 ? 2 : readValue(def.dim) > 0 ? 1 : 0;
    shape.setAttribute('fill', INDICATOR_FILL[level]);
  };
  c.touchAt = () => [];
  return c;
}

function buildPanelControl(def) {
  if (def.type === 'display') return buildPlateDisplay(def);
  if (def.type === 'bar') return buildPlateBar(def);
  if (def.type === 'hat') return buildPlateHat(def);
  if (def.type === 'button') return buildPlateButton(def);
  if (def.type === 'selector') {
    if (def.style === 'cover') return buildPlateCover(def);
    if (def.style === 'cap') return buildPlateCap(def);
    if (def.style === 'chip') return buildPlateChip(def);
    return buildPlateSwitch(def);
  }
  if (def.type === 'lever') return buildPlateLever(def);
  if (def.type === 'knob') return def.style === 'slider' ? buildPlateSlider(def) : buildPlateKnob(def);
  console.error('no panel drawing for control type ' + def.type + ' (' + def.id + ')');
  return null;
}

function buildControl(def, layout) {
  if (layout === 'panel') return buildPanelControl(def);
  if (def.type === 'selector') return layout === 'mpd' ? buildMpdKnob(def) : buildSelector(def);
  if (def.type === 'button') {
    if (layout === 'mpd') return buildMpdButton(def);
    return layout === 'ku' ? buildKuButton(def) : buildButton(def);
  }
  if (def.type === 'knob') return buildMpdKnob(def);
  if (def.type === 'stick') return buildStick(def);
  if (def.type === 'key' || def.type === 'macro') return buildKey(def);
  if (def.type === 'lever') return buildLever(def);
  if (def.type === 'hat') return layout === 'mpd' ? buildRocker(def) : buildHat(def);
  if (def.type === 'controls') return buildTrim(def);
  if (def.type === 'bar') return buildBar(def);
  if (def.type === 'display') return layout === 'ku' ? buildScratch(def) : buildDisplay(def);
  return null;
}

function place(c, row, col) {
  c.el.style.gridRow = row;
  c.el.style.gridColumn = col;
}

function boxRect(el, box, cx, cy, w, h) {
  el.style.left = (cx - w / 2 - box.x) / box.w * 100 + '%';
  el.style.top = (cy - h / 2 - box.y) / box.h * 100 + '%';
  el.style.width = w / box.w * 100 + '%';
  el.style.height = h / box.h * 100 + '%';
}

function svgLine(cls, x1, y1, x2, y2) {
  return '<line class="' + cls + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"/>';
}

function tedModeDeg(v) {
  const [, x, y] = TED_PRINT[2 + Math.min(Math.max(2 - Math.round(v), 0), 2)];
  const [kx, ky] = TED_GEO.MODE;
  return Math.atan2(x - kx, ky - y) * 180 / Math.PI;
}

function mpdSvg() {
  const line = (x1, y1, x2, y2) => svgLine('lead', x1, y1, x2, y2);
  const leaders = [];
  Object.keys(MPD_GEO).forEach((slot) => {
    const [x, y] = MPD_GEO[slot];
    if (slot === 'B1' || !/^[TLRB][1-6]$/.test(slot)) return;
    if (slot[0] === 'T') leaders.push(line(x, y + 26, x, 160));
    if (slot[0] === 'B') leaders.push(line(x, y - 26, x, 958));
    if (slot[0] === 'L') leaders.push(line(x + 26, y, 603, y));
    if (slot[0] === 'R') leaders.push(line(x - 26, y, 1397, y));
  });
  const [kx, ky] = MPD_GEO.MODE;
  MPD_PRINT.slice(2).forEach(([, x, y]) => {
    const len = Math.hypot(x - kx, y - ky);
    const ux = (x - kx) / len;
    const uy = (y - ky) / len;
    leaders.push(line(kx + ux * 50, ky + uy * 50, kx + ux * 64, ky + uy * 64));
  });
  const screws = [[490, 47], [1503, 47], [490, 1070], [1505, 1062]].map(([x, y], i) => (
    '<circle cx="' + x + '" cy="' + y + '" r="10" fill="#5b6269" stroke="#1a1c1e" stroke-width="2"/>'
    + '<line x1="' + (x - 6) + '" y1="' + y + '" x2="' + (x + 6) + '" y2="' + y + '" stroke="#1a1c1e" stroke-width="2.5" transform="rotate(' + (i * 35 + 20) + ' ' + x + ' ' + y + ')"/>'
  ));
  const text = MPD_PRINT.map(([t, x, y]) => '<text x="' + x + '" y="' + y + '" dy="0.35em">' + t + '</text>');
  const sc = MPD_SCREEN;
  return '<svg class="mart" viewBox="' + [MPD_BOX.x, MPD_BOX.y, MPD_BOX.w, MPD_BOX.h].join(' ') + '" preserveAspectRatio="none" aria-hidden="true">'
    + '<defs><linearGradient id="mbevel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4147"/><stop offset="1" stop-color="#15181a"/></linearGradient></defs>'
    + '<rect x="472" y="27" width="1056" height="1061" rx="46" fill="#26292c" stroke="#3d4348" stroke-width="4"/>'
    + '<path d="M512 27 H700 V112 Q700 165 648 165 H472 V67 Q472 27 512 27 Z" fill="#2f3438" stroke="#474e54" stroke-width="3"/>'
    + '<rect x="582" y="142" width="836" height="833" rx="14" fill="url(#mbevel)" stroke="#0e1012" stroke-width="3"/>'
    + '<rect x="' + sc.x + '" y="' + sc.y + '" width="' + sc.w + '" height="' + sc.h + '" rx="6" fill="#0b120d" stroke="#000" stroke-width="3"/>'
    + leaders.join('') + screws.join('') + text.join('')
    + '</svg>';
}

function tedSvg() {
  const sc = TED_SCREEN;
  const [kx, ky, kd] = TED_GEO.MODE;
  const leaders = ['B1', 'B2', 'B3', 'B4'].map((slot) => {
    const [x, y, , h] = TED_GEO[slot];
    return svgLine('lead', x, y - h / 2, x, sc.y + sc.h);
  });
  TED_PRINT.slice(2).forEach(([, x, y]) => {
    const len = Math.hypot(x - kx, y - ky);
    const ux = (x - kx) / len;
    const uy = (y - ky) / len;
    leaders.push(svgLine('lead', kx + ux * (kd / 2 + 3), ky + uy * (kd / 2 + 3), kx + ux * (kd / 2 + 13), ky + uy * (kd / 2 + 13)));
  });
  const text = TED_PRINT.map(([t, x, y]) => '<text x="' + x + '" y="' + y + '" dy="0.35em">' + t + '</text>');
  return '<svg class="mart ted" viewBox="' + [TED_BOX.x, TED_BOX.y, TED_BOX.w, TED_BOX.h].join(' ') + '" preserveAspectRatio="none" aria-hidden="true">'
    + '<defs><linearGradient id="tbevel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4147"/><stop offset="1" stop-color="#15181a"/></linearGradient></defs>'
    + '<rect x="5" y="3" width="555" height="552" rx="26" fill="#262829" stroke="#3d4348" stroke-width="3"/>'
    + '<rect x="85" y="70" width="420" height="410" rx="10" fill="url(#tbevel)" stroke="#0e1012" stroke-width="2"/>'
    + '<rect x="' + sc.x + '" y="' + sc.y + '" width="' + sc.w + '" height="' + sc.h + '" rx="4" fill="#0d1a17" stroke="#000" stroke-width="2"/>'
    + leaders.join('') + text.join('')
    + '</svg>';
}

function tedLabel(slot, text) {
  const sc = TED_SCREEN;
  const el = make('div', 'mlabel e-b', text);
  el.style.left = (TED_GEO[slot][0] - TED_BOX.x) / TED_BOX.w * 100 + '%';
  el.style.bottom = (TED_BOX.y + TED_BOX.h - (sc.y + sc.h) + 6) / TED_BOX.h * 100 + '%';
  return el;
}

function kuSvg() {
  const slots = KU_SLOTS.map((slot) => {
    const [x, y, , h] = KU_GEO[slot];
    return '<rect x="' + (x - 22.5) + '" y="' + (y + h / 2 + 8) + '" width="45" height="6" rx="2" fill="#121314" stroke="#3a3e42" stroke-width="1"/>';
  });
  const screws = KU_SCREWS.map(([x, y], i) => (
    '<circle cx="' + x + '" cy="' + y + '" r="9" fill="#5b6269" stroke="#1a1c1e" stroke-width="2"/>'
    + '<line x1="' + (x - 5.5) + '" y1="' + y + '" x2="' + (x + 5.5) + '" y2="' + y + '" stroke="#1a1c1e" stroke-width="2.2" transform="rotate(' + (i * 35 + 20) + ' ' + x + ' ' + y + ')"/>'
  ));
  const guides = KU_GUIDES.map(([x1, y1, x2, y2]) => svgLine('guide', x1, y1, x2, y2));
  return '<svg class="kart" viewBox="' + [KU_BOX.x, KU_BOX.y, KU_BOX.w, KU_BOX.h].join(' ') + '" preserveAspectRatio="none" aria-hidden="true">'
    + '<rect x="18" y="15" width="717" height="595" rx="30" fill="#2a2c2e" stroke="#40454a" stroke-width="3"/>'
    + '<rect x="52" y="488" width="113" height="104" rx="8" fill="#1c1e20" stroke="#0e0f10" stroke-width="3"/>'
    + slots.join('') + guides.join('') + screws.join('')
    + '</svg>';
}

function pbSlot(pb) {
  if (pb <= 6) return 'T' + pb;
  if (pb <= 12) return 'R' + (pb - 6);
  if (pb <= 18) return 'B' + (19 - pb);
  return 'L' + (25 - pb);
}

function mpdLabel(pb) {
  const slot = pbSlot(pb);
  const [cx, cy] = MPD_GEO[slot];
  const sc = MPD_SCREEN;
  const pad = 8;
  const el = make('div', 'mlabel e-' + slot[0].toLowerCase());
  const pctX = (x) => (x - MPD_BOX.x) / MPD_BOX.w * 100 + '%';
  const pctY = (y) => (y - MPD_BOX.y) / MPD_BOX.h * 100 + '%';
  if (slot[0] === 'T') {
    el.style.left = pctX(cx);
    el.style.top = pctY(sc.y + pad);
  } else if (slot[0] === 'B') {
    el.style.left = pctX(cx);
    el.style.bottom = (MPD_BOX.y + MPD_BOX.h - (sc.y + sc.h) + pad) / MPD_BOX.h * 100 + '%';
  } else if (slot[0] === 'L') {
    el.style.left = pctX(sc.x + pad);
    el.style.top = pctY(cy);
  } else {
    el.style.right = (MPD_BOX.x + MPD_BOX.w - (sc.x + sc.w) + pad) / MPD_BOX.w * 100 + '%';
    el.style.top = pctY(cy);
  }
  return el;
}

function loadMpdSide() {
  try {
    const side = localStorage.getItem(MPD_KEY + ':' + layoutAircraft);
    if (side === 'R' || side === 'T') return side;
  } catch (e) { /* storage not available, start on the left MPD */ }
  return 'L';
}

function saveMpdSide(side) {
  try {
    localStorage.setItem(MPD_KEY + ':' + layoutAircraft, side);
  } catch (e) { /* storage not available, the choice is not remembered */ }
}

function shownMpdSide() {
  return mpdView.pref === 'T' && current.seat !== 1 ? 'L' : mpdView.pref;
}

function showMpdGroup() {
  mpdView.grp.style.display = mpdView.side === 'T' ? 'none' : '';
  mpdView.tkr.style.display = mpdView.side === 'T' ? '' : 'none';
}

function showMpdSide(side) {
  if (mpdView.side === side) return;
  closeBar();
  mpdView.side = side;
  showMpdGroup();
  mpdView.stage.replaceChildren(mpdView.bezels[side]);
  DISPLAYS.forEach(([s]) => mpdView.buttons[s].classList.toggle('cur', s === side));
  fit();
}

function setMpdSide(side) {
  if (!mpdView) return;
  mpdView.pref = side;
  saveMpdSide(side);
  showMpdSide(shownMpdSide());
  renderMpd();
}

function halfTouch(c, [cx, cy, w, h]) {
  return c.halves.map((el, i) => {
    const sign = i ? 1 : -1;
    return c.vertical
      ? { el, cx, cy: cy + sign * h / 4, w, h: h / 2 }
      : { el, cx: cx + sign * w / 4, cy, w: w / 2, h };
  });
}

function placeMpd(box, cs) {
  const main = make('div', 'mpdmain');
  const cur = make('div', 'mpdcur');
  const grp = make('div', 'curgrp');
  const tkr = make('div', 'curgrp');
  const sw = make('div', 'seg mpdsw');
  const stage = make('div', 'mpdstage');
  mpdView = { pref: loadMpdSide(), side: null, main, cur, grp, tkr, sw, stage, bezels: {}, labels: {}, buttons: {}, touch: {} };
  mpdView.side = shownMpdSide();
  DISPLAYS.forEach(([side, name]) => {
    const btn = make('button', 'pos', name);
    btn.type = 'button';
    btn.addEventListener('click', () => setMpdSide(side));
    btn.classList.toggle('cur', side === mpdView.side);
    sw.append(btn);
    mpdView.buttons[side] = btn;
    const ted = side === 'T';
    const bezel = make('div', ted ? 'mbezel ted' : 'mbezel');
    bezel.insertAdjacentHTML('beforeend', ted ? tedSvg() : mpdSvg());
    const items = cs.filter((c) => c.def.side === side && DISP_GEO[side][c.def.slot]);
    if (ted) {
      items.forEach((c) => { if (/^B[1-4]$/.test(c.def.slot)) bezel.append(tedLabel(c.def.slot, c.def.label)); });
    } else {
      mpdView.labels[side] = {};
      for (let pb = 1; pb <= 24; pb++) {
        mpdView.labels[side][pb] = mpdLabel(pb);
        bezel.append(mpdView.labels[side][pb]);
      }
    }
    mpdView.touch[side] = [];
    items.forEach((c) => {
      const geo = DISP_GEO[side][c.def.slot];
      boxRect(c.el, DISP_BOX[side], ...geo);
      bezel.append(c.el);
      if (c.halves) mpdView.touch[side].push(...halfTouch(c, geo));
      else mpdView.touch[side].push({ el: c.el, cx: geo[0], cy: geo[1], w: geo[2], h: geo[3] });
    });
    mpdView.bezels[side] = bezel;
  });
  const bySlot = {};
  cs.forEach((c) => { if (!c.def.side) bySlot[c.def.slot] = c; });
  const row = make('div', 'curbtns');
  if (bySlot.CURSOR) grp.append(bySlot.CURSOR.el);
  ['CURSOR_DISPLAY', 'CURSOR_ENTER'].forEach((slot) => { if (bySlot[slot]) row.append(bySlot[slot].el); });
  grp.append(row);
  const tkrRow = make('div', 'curbtns');
  if (bySlot.TKR) tkr.append(bySlot.TKR.el);
  if (bySlot.TKR_SLAVE) tkrRow.append(bySlot.TKR_SLAVE.el);
  tkr.append(tkrRow);
  cur.append(grp, tkr);
  showMpdGroup();
  main.append(sw, stage);
  box.append(main, cur);
  stage.append(mpdView.bezels[mpdView.side]);
}

function renderMpd() {
  if (!mpdView) return;
  const want = shownMpdSide();
  if (want !== mpdView.side) showMpdSide(want);
  mpdView.buttons.T.style.display = current.seat === 1 ? '' : 'none';
  const m = current.mpdLabels;
  const live = !!m && typeof m.age === 'number' && m.age <= STALE_S;
  MPD_SIDES.forEach(([side]) => {
    const texts = {};
    if (live && m[side]) Object.keys(m[side]).forEach((pb) => { texts[parseInt(pb, 10)] = m[side][pb]; });
    for (let pb = 1; pb <= 24; pb++) {
      const text = typeof texts[pb] === 'string' ? texts[pb] : '';
      const el = mpdView.labels[side][pb];
      if (el.textContent !== text) el.textContent = text;
    }
  });
}

function innerSize(box) {
  const cs = getComputedStyle(box);
  return [
    box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight),
    box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom),
  ];
}

function spread(touch, s) {
  const items = touch.map((t) => {
    const item = { el: t.el, x: t.cx * s, y: t.cy * s, vw: t.w * s, vh: t.h * s };
    const least = t.min || TOUCH_MIN;
    item.hw = Math.max(item.vw, least) / 2;
    item.hh = Math.max(item.vh, least) / 2;
    return item;
  });
  const cut = (item, key, floor, amount) => {
    const taken = Math.min(amount, item[key] - floor);
    item[key] -= taken;
    return amount - taken;
  };
  for (let pass = 0; pass < 3; pass++) {
    items.forEach((a, n) => items.slice(n + 1).forEach((b) => {
      const dx = Math.abs(a.x - b.x);
      const dy = Math.abs(a.y - b.y);
      if (dx >= a.hw + b.hw || dy >= a.hh + b.hh) return;
      const wide = dx / (a.hw + b.hw) >= dy / (a.hh + b.hh);
      const key = wide ? 'hw' : 'hh';
      const vis = wide ? 'vw' : 'vh';
      const excess = a[key] + b[key] - (wide ? dx : dy) + 1;
      const rest = cut(b, key, b[vis] / 2, excess / 2 + cut(a, key, a[vis] / 2, excess / 2));
      cut(a, key, a[vis] / 2, rest);
    }));
  }
  items.forEach((i) => {
    i.el.style.setProperty('--hw', i.hw * 2 + 'px');
    i.el.style.setProperty('--hh', i.hh * 2 + 'px');
  });
}

function fitMpd() {
  if (!mpdView) return;
  const side = mpdView.side;
  const bx = DISP_BOX[side];
  const area = document.getElementById('controls');
  const [areaW, areaH] = innerSize(area);
  const gap = parseFloat(getComputedStyle(area).columnGap);
  mpdView.main.style.width = Math.max(0, Math.min(mpdView.stage.clientHeight * bx.w / bx.h, areaW - CUR_MIN - gap)) + 'px';
  const rowH = (side === 'T' ? mpdView.tkr : mpdView.grp).lastElementChild.offsetHeight;
  const pad = Math.max(0, Math.floor(Math.min(mpdView.cur.clientWidth, areaH - 2 * GEAR_CLEAR - rowH - 8)));
  mpdView.grp.style.width = mpdView.tkr.style.width = pad + 'px';
  const w = mpdView.stage.clientWidth;
  const h = mpdView.stage.clientHeight;
  const s = Math.min(w / bx.w, h / bx.h);
  if (!(s > 0)) return;
  const bw = bx.w * s;
  const bh = bx.h * s;
  const st = mpdView.bezels[side].style;
  st.left = (w - bw) / 2 + 'px';
  st.top = (h - bh) / 2 + 'px';
  st.width = bw + 'px';
  st.height = bh + 'px';
  st.setProperty('--bh', bh + 'px');
  spread(mpdView.touch[side], s);
}

function placeKu(box, cs) {
  const panel = make('div', 'kupanel');
  panel.insertAdjacentHTML('beforeend', kuSvg());
  kuView = { panel, touch: [] };
  cs.forEach((c) => {
    const geo = KU_GEO[c.def.slot];
    if (!geo) return;
    boxRect(c.el, KU_BOX, ...geo);
    panel.append(c.el);
    if (c.def.type !== 'display') kuView.touch.push({ el: c.el, cx: geo[0], cy: geo[1], w: geo[2], h: geo[3] });
  });
  box.append(panel);
}

function fitKu() {
  if (!kuView) return;
  const [w, h] = innerSize(document.getElementById('controls'));
  const s = Math.min(w / KU_BOX.w, h / KU_BOX.h);
  if (!(s > 0)) return;
  const st = kuView.panel.style;
  st.width = KU_BOX.w * s + 'px';
  st.height = KU_BOX.h * s + 'px';
  st.setProperty('--bh', KU_BOX.h * s + 'px');
  spread(kuView.touch, s);
}

function plateArt(a) {
  const [x, y, w, h] = a.at;
  const tag = (cls) => (cls ? ' class="' + cls + '"' + (a.for ? ' data-for="' + a.for + '"' : '') : '');
  const rect = (r, style, cls) => '<rect' + tag(cls) + ' x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + r + '" ' + style + '/>';
  if (a.shape === 'plate') {
    const colours = a.look === 'a10c' ? 'fill="#3b4045" stroke="#50565c"' : 'fill="#26292c" stroke="#3d4348"';
    return rect(a.r, colours + ' stroke-width="' + a.border + '"', 'k-plate');
  }
  if (a.shape === 'ear') return rect(a.r, 'fill="#33373b" stroke="#474e54" stroke-width="' + a.border + '"', 'k-ear');
  if (a.shape === 'bracket') return rect(6, 'fill="#33373b" stroke="#474e54" stroke-width="2"');
  if (a.shape === 'outline') return rect(4, 'fill="none" stroke="#e8e8e8" stroke-width="' + a.stroke + '"', 'k-frame');
  if (a.shape === 'screw') {
    return '<g class="k-screw" data-size="' + a.size + '"><circle cx="' + x + '" cy="' + y + '" r="' + w + '" fill="#5b6269" stroke="#1a1c1e" stroke-width="2"/>'
      + '<line x1="' + (x - w * 0.6) + '" y1="' + y + '" x2="' + (x + w * 0.6) + '" y2="' + y + '" stroke="#1a1c1e" stroke-width="2.4" transform="rotate(' + a.rot + ' ' + x + ' ' + y + ')"/></g>';
  }
  if (a.shape === 'dzus') {
    return '<g class="k-dzus"><circle cx="' + x + '" cy="' + y + '" r="' + w + '" fill="#7a8086" stroke="#2a2d30" stroke-width="2"/>'
      + '<line x1="' + (x - w * 0.6) + '" y1="' + y + '" x2="' + (x + w * 0.6) + '" y2="' + y + '" stroke="#2a2d30" stroke-width="2.4" transform="rotate(' + a.rot + ' ' + x + ' ' + y + ')"/></g>';
  }
  if (a.shape === 'slot') return rect(10, 'fill="#0b0c0d" stroke="#3a3f44" stroke-width="3"', a.for ? 'k-pad' : a.body ? 'k-body' : '');
  if (a.shape === 'glass') return rect(8, 'fill="#121a16" stroke="#3a3f44" stroke-width="3"', 'k-pad');
  if (a.shape === 'line') return '<line x1="' + x + '" y1="' + y + '" x2="' + (x + w) + '" y2="' + (y + h) + '" stroke="#e8e8e8" stroke-width="3"/>';
  if (a.shape === 'arrow') {
    const tip = a.up ? y : y + h;
    const back = a.up ? tip + w : tip - w;
    return '<path d="M' + (x + w / 2) + ' ' + (a.up ? y + h : y) + 'V' + tip + 'M' + x + ' ' + back + 'L' + (x + w / 2) + ' ' + tip + 'L' + (x + w) + ' ' + back
      + '" fill="none" stroke="#e8e8e8" stroke-width="3"/>';
  }
  if (a.shape === 'path') {
    return '<path' + (a.part ? ' data-kit="' + a.part + '" data-id="' + a.name + '"' : '') + ' transform="translate(' + x + ' ' + y + ')' + (a.scale ? ' scale(' + a.scale + ')' : '')
      + '" d="' + a.d + '" fill="' + (a.fill ? '#e8e8e8' : 'none') + '" stroke="#e8e8e8" stroke-width="' + a.width + '" stroke-linecap="round" stroke-linejoin="round"/>';
  }
  if (a.shape === 'text') {
    return '<text x="' + x + '" y="' + y + '" dy="0.35em" font-size="' + a.size + '"'
      + (a.width ? ' textLength="' + a.width + '" lengthAdjust="spacingAndGlyphs"' : '') + '>' + a.text + '</text>';
  }
  if (a.shape === 'hazard') {
    const box = (bx, by, bw, bh) => 'M' + bx + ' ' + by + 'h' + bw + 'v' + bh + 'h' + -bw + 'z';
    const disc = (bx, by, bw) => 'M' + bx + ' ' + (by + bw / 2) + 'a' + bw / 2 + ' ' + bw / 2 + ' 0 1 0 ' + bw + ' 0a' + bw / 2 + ' ' + bw / 2 + ' 0 1 0 ' + -bw + ' 0z';
    const hole = a.hole ? (a.round ? disc(...a.hole) : box(...a.hole)) : '';
    return '<path' + tag('k-pad') + ' d="' + box(x, y, w, h) + hole + '" fill="url(#phaz)" fill-rule="evenodd" stroke="#111" stroke-width="' + a.border + '"/>';
  }
  return '';
}

function plateSvg(view) {
  const [w, h] = view.box;
  const text = view.print.map(([t, x, y, size, width, rot]) => (
    '<text class="k-label" x="' + x + '" y="' + y + '" dy="0.35em" font-size="' + size + '"'
    + (width ? ' textLength="' + width + '" lengthAdjust="spacingAndGlyphs"' : '')
    + (rot ? ' transform="rotate(' + rot + ' ' + x + ' ' + y + ')"' : '') + '>' + t + '</text>'
  ));
  const stripe = (view.art.find((a) => a.shape === 'hazard') || {}).period || 34;
  return '<svg class="part" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">'
    + '<defs><pattern id="phaz" patternUnits="userSpaceOnUse" width="' + stripe + '" height="' + stripe + '" patternTransform="rotate(45)">'
    + '<rect width="' + stripe / 2 + '" height="' + stripe + '" fill="#e0c21a"/><rect x="' + stripe / 2 + '" width="' + stripe / 2 + '" height="' + stripe + '" fill="#e4e4e0"/></pattern></defs>'
    + view.art.map(plateArt).join('') + text.join('')
    + '</svg>';
}

function placePlate(box, cs) {
  const view = views[activeIndex];
  const pbox = make('div', 'pbox kit');
  pbox.insertAdjacentHTML('beforeend', plateSvg(view));
  pbox.dataset.box = view.box.join(' ');
  pbox.dataset.ref = view.ref.join(' ');
  plateView = { pbox, box: view.box, ref: view.ref, touch: [], frame: null, mark: null };
  cs.forEach((c) => {
    const [x, y, w, h] = c.def.at;
    boxRect(c.el, { x: 0, y: 0, w: view.box[0], h: view.box[1] }, x + w / 2, y + h / 2, w, h);
    if (c.def.kit && c.def.kit.part !== 'FLAP') {
      c.el.dataset.kit = c.def.kit.part;
      c.el.dataset.id = c.def.id;
    }
    pbox.append(c.el);
    plateView.touch.push(...c.touchAt(c.def.at));
  });
  if (view.scroll) {
    pbox.dataset.scroll = '';
    box.append(scrollFrame(pbox));
  } else {
    box.append(pbox);
  }
}

function scrollFrame(pbox) {
  const frame = make('div', 'pscroll');
  const area = make('div', 'pscroller');
  const up = make('div', 'pshade up');
  const down = make('div', 'pshade down');
  const track = make('div', 'ptrack');
  const thumb = make('div', 'pthumb');
  up.innerHTML = ICONS['chev-up'];
  down.innerHTML = ICONS['chev-down'];
  track.append(thumb);
  area.append(pbox);
  frame.append(area, up, down, track);
  plateView.frame = frame;
  plateView.mark = () => {
    const total = area.scrollHeight;
    up.classList.toggle('on', area.scrollTop > 0);
    down.classList.toggle('on', area.scrollTop + area.clientHeight < total - 1);
    thumb.style.height = area.clientHeight / total * 100 + '%';
    thumb.style.top = area.scrollTop / total * 100 + '%';
  };
  area.addEventListener('scroll', plateView.mark);
  return frame;
}

function fitPlate() {
  if (!plateView) return;
  const [bw, bh] = plateView.box;
  const [rw, rh] = plateView.ref;
  const [w, h] = innerSize(document.getElementById('controls'));
  const s = Math.min(w / rw, h / rh, KIT_SCALE_MAX);
  if (!(s > 0)) return;
  const st = plateView.pbox.style;
  st.width = bw * s + 'px';
  st.height = bh * s + 'px';
  st.setProperty('--bh', bh * s + 'px');
  st.setProperty('--du', s + 'px');
  spread(plateView.touch, s);
  if (plateView.frame) {
    plateView.frame.style.maxHeight = h + 'px';
    plateView.mark();
  }
}

function homeView() {
  return views.find((v) => v.layout === 'map');
}

function shownSeat() {
  return current.seat === 1 ? 1 : 0;
}

function openLink(link) {
  showView(views.findIndex((v) => v.name === link.view));
  if (link.side) setMpdSide(link.side);
}

function pageEntries(seat) {
  const entries = [];
  views.forEach((v, index) => {
    if (v.panel && v.seats.includes(seat)) entries.push({ label: v.name, map: v.map, link: false, go: () => showView(index) });
  });
  homeView().links.forEach((link) => {
    if (link.seats.includes(seat)) entries.push({ label: link.label, map: link.map, link: true, go: () => openLink(link) });
  });
  return entries.sort((a, b) => a.map[0] - b.map[0] || a.map[1] - b.map[1]);
}

function cell(el, [row, col, rows, cols]) {
  el.style.gridRow = row + ' / span ' + rows;
  el.style.gridColumn = col + ' / span ' + cols;
}

function placeMap(box, cs) {
  mapView = { box, seat: null, boxes: [], controls: cs };
  cs.forEach((c) => {
    cell(c.el, c.def.map);
    box.append(c.el);
  });
  renderMap();
}

function renderMap() {
  if (!mapView) return;
  const seat = shownSeat();
  if (mapView.seat !== seat) {
    mapView.boxes.forEach((b) => b.remove());
    mapView.boxes = pageEntries(seat).map((e) => {
      const btn = make('button', e.link ? 'mapbox link' : 'mapbox', e.label.toUpperCase());
      btn.type = 'button';
      cell(btn, e.map);
      btn.addEventListener('click', e.go);
      mapView.box.append(btn);
      return btn;
    });
    mapView.seat = seat;
  }
  mapView.controls.forEach((c) => {
    c.el.style.display = c.def.seats && !c.def.seats.includes(seat) ? 'none' : '';
  });
}

function openPages() {
  pagesSeat = null;
  document.getElementById('pages').classList.add('open');
  renderPages();
}

function closePages() {
  document.getElementById('pages').classList.remove('open');
}

function renderPages() {
  if (!document.getElementById('pages').classList.contains('open')) return;
  const seat = shownSeat();
  if (pagesSeat === seat) return;
  pagesSeat = seat;
  document.getElementById('pagelist').replaceChildren(...pageEntries(seat).map((e) => {
    const btn = make('button', 'pos', e.label.toUpperCase());
    btn.type = 'button';
    btn.addEventListener('click', () => {
      closePages();
      e.go();
    });
    return btn;
  }));
}

function followSeat() {
  const view = views[activeIndex];
  if (!view || (current.status !== 'live' && debugSeat === null) || view.seats.includes(current.seat)) return;
  const i = views.findIndex((v) => v.name === view.name && v.seats.includes(current.seat));
  if (i >= 0) showView(i);
  else if (view.panel) showView(views.indexOf(homeView()));
}

function placeGrid(box, cs) {
  cs.forEach((c) => {
    const [row, col, rows, cols] = c.def.grid;
    place(c, row + ' / span ' + rows, col + ' / span ' + cols);
    box.append(c.el);
  });
}

const PLACERS = { mpd: placeMpd, ku: placeKu, panel: placePlate, map: placeMap };

function fit() {
  const name = document.getElementById('controls').className;
  if (name === 'mpd') fitMpd();
  else if (name === 'ku') fitKu();
  else if (name === 'plate') fitPlate();
}

function showView(index) {
  activeIndex = index;
  const view = views[index];
  saveTab(view.panel ? homeView().name : view.name);
  const lampBox = document.getElementById('lamps');
  const controlBox = document.getElementById('controls');
  const layout = view.layout || null;
  const grid = !layout && view.controls.some((d) => d.grid);
  mpdView = null;
  kuView = null;
  mapView = null;
  plateView = null;
  knobGroups = {};
  closePopups();
  closeGuard();
  closePages();
  lampBox.replaceChildren();
  controlBox.replaceChildren();
  controlBox.className = LAYOUT_CLASS[layout] || layout || (grid ? 'grid' : '');
  lampBox.classList.toggle('compact', grid || layout === 'map' || layout === 'panel');
  lampBox.style.display = view.lamps.length ? '' : 'none';
  lamps = view.lamps.map(buildLamp);
  controls = [...view.controls.map((d) => buildControl(d, layout)), ...(view.indicators || []).map(buildIndicator)].filter((c) => c !== null);
  lamps.forEach((l) => lampBox.append(l.el));
  if (layout && PLACERS[layout]) PLACERS[layout](controlBox, controls);
  else if (grid) placeGrid(controlBox, controls);
  else controls.forEach((c) => controlBox.append(c.el));
  fit();
  updateTabs();
  render();
}

function updateTabs() {
  const view = views[activeIndex];
  tabs.forEach(({ el, name, map }) => {
    const home = map && !!view.panel;
    el.classList.toggle('active', name === view.name || home);
    el.textContent = name.toUpperCase();
    if (home) el.insertAdjacentHTML('afterbegin', ICONS['chev-left']);
  });
}

function holdPress(el, ms, action) {
  let timer = null;
  const stop = () => {
    clearTimeout(timer);
    timer = null;
  };
  el.addEventListener('pointerdown', () => {
    stop();
    el.held = false;
    timer = setTimeout(() => {
      el.held = true;
      action();
    }, ms);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((type) => el.addEventListener(type, stop));
}

function cycleDebugSeat() {
  if (seats.length < 2) return;
  const real = current.status === 'live' ? realSeat : null;
  const order = real === null ? [null, 1, 0] : [null, 1 - real];
  debugSeat = order[(order.indexOf(debugSeat) + 1) % order.length];
  current.seat = activeSeat();
  render();
}

function buildTabs() {
  const nav = document.getElementById('tabs');
  tabs = [];
  views.forEach((v) => {
    if (v.panel || tabs.some((t) => t.name === v.name)) return;
    const tab = make('button', 'tab', v.name.toUpperCase());
    tab.type = 'button';
    tab.addEventListener('click', () => {
      if (tab.held) {
        tab.held = false;
        return;
      }
      showView(viewIndex(v.name));
    });
    if (v.layout === 'map') holdPress(tab, LIST_HOLD_MS, openPages);
    nav.append(tab);
    tabs.push({ el: tab, name: v.name, map: v.layout === 'map' });
  });
}

function loadWake() {
  try {
    return localStorage.getItem(WAKE_KEY) === 'on';
  } catch (e) { /* storage not available, screen stays as the tablet has it */ }
  return false;
}

function saveWake(on) {
  try {
    localStorage.setItem(WAKE_KEY, on ? 'on' : 'off');
  } catch (e) { /* storage not available, the choice is not remembered */ }
}

async function applyWake(notify) {
  if (!wakeSupported) return;
  if (!wakeWanted) {
    const old = wakeLock;
    wakeLock = null;
    if (old) {
      try { await old.release(); } catch (e) { /* already released */ }
    }
    return;
  }
  if (wakeLock || document.visibilityState !== 'visible') return;
  try {
    const lock = await navigator.wakeLock.request('screen');
    if (!wakeWanted || wakeLock) {
      lock.release().catch(() => {});
      return;
    }
    wakeLock = lock;
    lock.addEventListener('release', () => {
      if (wakeLock === lock) wakeLock = null;
    });
  } catch (e) {
    if (notify) toast('could not keep the screen on');
  }
}

function setWake(on) {
  if (!wakeSupported || wakeWanted === on) return;
  wakeWanted = on;
  saveWake(on);
  renderSettings();
  applyWake(true);
}

function buildSeg(box, onPick, items = [['OFF', false], ['ON', true]]) {
  return items.map(([label, value]) => {
    const btn = make('button', 'pos', label);
    btn.type = 'button';
    btn.addEventListener('click', () => onPick(value));
    box.append(btn);
    return [btn, value];
  });
}

async function setLogging(on) {
  if (!serverSettings || loggingPending !== null || serverSettings.logging === on) return;
  loggingPending = on;
  renderSettings();
  try {
    const r = await fetch('/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ logging: on }),
    });
    if (r.ok) {
      serverSettings = await r.json();
    } else {
      let message = 'error ' + r.status;
      try { message = (await r.json()).error || message; } catch (e) { /* keep the status text */ }
      toast(message);
    }
  } catch (e) {
    toast(UNREACHABLE);
  }
  loggingPending = null;
  renderSettings();
}

async function setAircraft(mode) {
  if (!serverSettings || aircraftPending !== null || serverSettings.aircraft_mode === mode) return;
  aircraftPending = mode;
  renderSettings();
  try {
    const r = await fetch('/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ aircraft: mode }),
    });
    if (r.ok) {
      serverSettings = await r.json();
    } else {
      let message = 'error ' + r.status;
      try { message = (await r.json()).error || message; } catch (e) { /* keep the status text */ }
      toast(message);
    }
  } catch (e) {
    toast(UNREACHABLE);
  }
  aircraftPending = null;
  renderSettings();
}

function renderSettings() {
  const known = !!serverSettings;
  acftButtons.forEach(([btn, value]) => {
    btn.classList.toggle('cur', known && serverSettings.aircraft_mode === value);
    btn.classList.toggle('pending', aircraftPending === value);
    btn.setAttribute('aria-disabled', String(!known || aircraftPending !== null));
  });
  logButtons.forEach(([btn, value]) => {
    btn.classList.toggle('cur', known && serverSettings.logging === value);
    btn.classList.toggle('pending', loggingPending === value);
    btn.setAttribute('aria-disabled', String(!known || loggingPending !== null));
  });
  wakeButtons.forEach(([btn, value]) => {
    btn.classList.toggle('cur', wakeSupported && wakeWanted === value);
    btn.classList.toggle('dis', !wakeSupported);
    btn.setAttribute('aria-disabled', String(!wakeSupported));
  });
  document.getElementById('wakehelp').textContent = wakeSupported
    ? 'Stops the tablet from dimming and locking.'
    : 'Not supported on this device.';
  const none = serverSettings === false ? UNREACHABLE : '';
  document.getElementById('acfthelp').textContent = known
    ? 'Detected in DCS: ' + (serverSettings.detected || 'none') + '. Active: ' + serverSettings.aircraft + '.'
    : none;
  document.getElementById('info-saved').textContent = known ? serverSettings.saved_games : none;
  document.getElementById('info-address').textContent = known ? serverSettings.address : none;
}

async function openSettings() {
  document.body.classList.add('settings-open');
  document.getElementById('settings').classList.add('open');
  serverSettings = null;
  renderSettings();
  try {
    serverSettings = await getJson('/settings');
    const box = document.getElementById('acftseg');
    box.replaceChildren();
    acftButtons = buildSeg(box, setAircraft, [['AUTO', 'auto'], ...serverSettings.aircraft_names.map((n) => [n, n])]);
  } catch (e) {
    serverSettings = false;
  }
  renderSettings();
}

function closeSettings() {
  document.body.classList.remove('settings-open');
  document.getElementById('settings').classList.remove('open');
}

async function poll() {
  try {
    const s = await getJson('/state');
    if (s.aircraft !== layoutAircraft) {
      location.reload();
      return;
    }
    realSeat = s.seat;
    current = { status: statusOf(s), seat: activeSeat(), values: s.values || {}, controls: s.controls || {}, controlsAge: s.controls_age, trim: s.trim || {}, mpdLabels: s.mpd_labels || null };
  } catch (e) {
    current = { status: 'offline', seat: activeSeat(), values: current.values, controls: {}, controlsAge: null, trim: {}, mpdLabels: null };
  }
  render();
  setTimeout(poll, POLL_MS);
}

async function init() {
  renderBadge();
  wakeWanted = wakeSupported && loadWake();
  applyWake(false);
  for (;;) {
    try {
      const layout = await getJson('/layout');
      views = layout.views;
      layoutAircraft = layout.aircraft;
      seats = layout.seats;
      break;
    } catch (e) {
      await sleep(1000);
    }
  }
  buildTabs();
  showView(loadTab());
  poll();
}

['gesturestart', 'gesturechange', 'gestureend', 'dblclick', 'contextmenu'].forEach((type) => {
  document.addEventListener(type, (e) => e.preventDefault());
});
document.addEventListener('touchmove', (e) => {
  if (!e.target.closest('.pscroll')) e.preventDefault();
}, { passive: false });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && wakeWanted) applyWake(false);
});

window.addEventListener('resize', fit);
if ('ResizeObserver' in window) new ResizeObserver(fit).observe(document.getElementById('controls'));

const wakeSupported = 'wakeLock' in navigator;
const logButtons = buildSeg(document.getElementById('logseg'), setLogging);
const wakeButtons = buildSeg(document.getElementById('wakeseg'), setWake);
initBar();
holdPress(document.getElementById('seat'), DEBUG_HOLD_MS, cycleDebugSeat);
document.body.insertAdjacentHTML('beforeend', knobDefs());
document.getElementById('pageclose').addEventListener('click', closePages);
document.getElementById('pages').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closePages();
});
document.getElementById('gear').addEventListener('click', openSettings);
document.getElementById('back').addEventListener('click', closeSettings);
renderSettings();

init();
</script>
