# Copy this file to config.toml and adjust it to your machine.
# config.toml is ignored by git, so your local paths stay private.

[dcs]
# DCS Saved Games folder. "auto" finds it (Saved Games\DCS or DCS.openbeta with DCS-BIOS installed).
# Otherwise give the path, e.g. %USERPROFILE%\\Saved Games\\DCS
saved_games = "auto"
# Part of the DCS window title, used to bring DCS to the front before a keypress (Stage 2).
window_title = "Digital Combat Simulator"

[dcs_bios]
# DCS-BIOS defaults
export_multicast = "239.255.50.10"
export_port = 5010
command_port = 7778

[export]
# UDP port the export script sends to. Must match PORT in lua/DCS-Dashboard-Export.lua.
port = 7790

[keys]
# DCS keybinds sent as keypresses (Stage 2). Modifiers and key joined by "+".
# Defaults from the DCS install; change them if you rebound them in DCS.
power_left_idle = "RAlt+Home"
power_right_idle = "RShift+Home"
power_left_up = "RAlt+PageUp"
power_right_up = "RShift+PageUp"
power_left_down = "RAlt+PageDown"
power_right_down = "RShift+PageDown"
power_left_off = "RAlt+End"
power_right_off = "RShift+End"
# Opens / closes the canopy (DCS "Open/Close Cockpit Door").
canopy = "LCtrl+C"
# Shows / hides the IHADSS monocle (DCS "IHADSS show").
monocle = "I"
# Toggles DCS's controls indicator overlay (DCS "Show controls indicator").
controls_overlay = "RCtrl+Enter"
# DCS "Trimmer reset": the dashboard watches this key while DCS is in front and recentres the trim display.
trim_reset = "LCtrl+T"
george_show_hide = "LCtrl+V"
george_up = "W"
george_down = "S"
george_left = "A"
george_right = "D"

[dashboard]
# Web server for the tablet. 0.0.0.0 = reachable from the local network.
host = "0.0.0.0"
port = 8080

[log]
file = "logs/dcs-dashboard.log"
max_mb = 5
# Active file plus 2 backups = 3 files of max_mb, about 15 MB in total.
backups = 2
