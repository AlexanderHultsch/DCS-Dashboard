# Copy this file to config.toml and adjust it to your machine.
# config.toml is ignored by git, so your local paths stay private.

[dcs]
# DCS Saved Games folder. Usually one of:
#   %USERPROFILE%\Saved Games\DCS
#   %USERPROFILE%\Saved Games\DCS.openbeta
saved_games = "%USERPROFILE%\\Saved Games\\DCS"
# Part of the DCS window title, used to bring DCS to the front before a keypress (Stage 2).
window_title = "Digital Combat Simulator"

[dcs_bios]
# DCS-BIOS defaults
export_multicast = "239.255.50.10"
export_port = 5010
command_port = 7778

[export]
# UDP port the export script sends to. Must match PORT in lua/DCS-Dashboard-Export.lua.
port = 7790

[keys]
# DCS keybinds sent as keypresses (Stage 2). Modifiers and key joined by "+".
# Defaults from the DCS install; change them if you rebound them in DCS.
george_show_hide = "LCtrl+V"
george_up = "W"
george_down = "S"
george_left = "A"
george_right = "D"

[dashboard]
# Web server for the tablet. 0.0.0.0 = reachable from the local network.
host = "0.0.0.0"
port = 8080

[log]
file = "logs/dcs-dashboard.log"
max_mb = 5
# Active file plus 2 backups = 3 files of max_mb, about 15 MB in total.
backups = 2
